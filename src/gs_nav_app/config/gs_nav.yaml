# 必须与 ar_nav.launch.py 中 Qt 节点的 name="gs_qt_nav" 保持一致。
/gs_qt_nav:
  ros__parameters:
    # 与 mecanum_navigation 启动文件保持相同的仿真时钟。
    use_sim_time: true
    camera_topic: /camera/camera/color/image_raw
    camera_info_topic: /camera/camera/color/camera_info
    # 直接使用导航 map_server 发布的同一份栅格地图。
    map_topic: /map
    # Nav2 默认全局路径；兼容旧 TEB/global_planner 的 /global_plan。
    path_topic: /plan
    path_topic_fallbacks:
      - /global_plan
    # 可选：订阅实时 PointCloud2 作为点云地图；留空时只使用本地 PCD/PLY。
    pointcloud_topic: ""
    # 程序启动时自动加载的 PCD/PLY；也可在界面中点击“加载 PCD/PLY”重新选择。
    # ar_nav.launch.py 默认传入包内 maps/dilo_map.pcd；设为空可禁用启动时加载。
    pointcloud_map_path: ""
    # 所有 PCD/PLY 与 Nav2 YAML/PGM 的统一默认保存目录。
    # 留空时自动使用当前工作空间的 src/gs_nav_map。
    map_storage_dir: ""

    map_frame: map
    base_frame: base_link
    # 留空时使用相机图像 header.frame_id；也可直接填写 camera_color_optical_frame。
    camera_frame: ""

    # auto: 优先 CameraInfo + TF 标定投影，缺失时回退到可调地面投影。
    # calibrated: 只允许标定投影；ground: 强制使用地面投影。
    projection_mode: auto
    route_width_m: 0.95
    camera_height_m: 0.72
    horizon_ratio: 0.43

    # 屏幕任一边小于 700 像素时自动使用紧凑布局并全屏显示。
    fullscreen_on_small_screen: true
